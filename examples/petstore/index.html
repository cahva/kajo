<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An OpenAPI-first Petstore powered by Kajo." />
    <title>Kajo OpenAPI Petstore</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">Kajo OpenAPI-first example</p>
      <h1>Petstore,<br />without the backend.</h1>
      <p class="intro">
        The API starts with the unmodified OpenAPI 3.1 Petstore document. Its TypeScript types, Kajo
        routes, and generated fallbacks all come from the same contract.
      </p>

      <section class="controls" aria-label="Petstore controls">
        <button id="available">Available pets</button>
        <button id="pet">Pet 1</button>
        <button id="order">Order 1</button>
        <button id="inventory">Generated inventory fallback</button>
      </section>

      <section class="create">
        <form id="pet-form">
          <label>
            Pet name
            <input name="name" value="Kajo" required />
          </label>
          <button type="submit">Add available pet</button>
        </form>
      </section>

      <section>
        <div class="result-heading">
          <h2 id="result-title">Available pets</h2>
          <span id="mode">Implemented operation</span>
        </div>
        <pre id="result" aria-live="polite"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
